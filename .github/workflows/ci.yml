name: CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x LTS (8.0.12 não disponível no install script; CVE-2024-43483 mitigado via Caching.Memory 9.0.0)
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
      - name: Restore
        run: dotnet restore Arah.sln
      - name: Build
        run: dotnet build Arah.sln --no-restore --configuration Release
      - name: Test with Coverage
        run: |
          dotnet test backend/Tests/Arah.Tests/Arah.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory:"${{ runner.temp }}/test-results" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Test BFF
        run: dotnet test backend/Tests/Arah.Tests.Bff/Arah.Tests.Bff.csproj --no-build --configuration Release --verbosity normal
      - name: Coverage summary
        run: |
          F=$(find "${{ runner.temp }}/test-results" -name "coverage.cobertura.xml" 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            LR=$(grep -m1 'line-rate=' "$F" | sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p') || true
            BR=$(grep -m1 'branch-rate=' "$F" | sed -n 's/.*branch-rate="\([0-9.]*\)".*/\1/p') || true
            LR=${LR:-0}; BR=${BR:-0}
            echo "## Coverage summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            printf "| Lines | %.1f%% |\n" $(echo "$LR" | awk '{print $1*100}') >> $GITHUB_STEP_SUMMARY
            printf "| Branches | %.1f%% |\n" $(echo "$BR" | awk '{print $1*100}') >> $GITHUB_STEP_SUMMARY
          fi
      - name: Find coverage file
        id: coverage
        run: |
          F=$(find "${{ runner.temp }}/test-results" -name "coverage.cobertura.xml" 2>/dev/null | head -1)
          echo "path=${F:-}" >> $GITHUB_OUTPUT
      # Para branches protegidas/PRs o Codecov pode exigir token: adicione CODECOV_TOKEN em Settings > Secrets.
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v4
        if: success() && steps.coverage.outputs.path != ''
        with:
          files: ${{ steps.coverage.outputs.path }}
          fail_ci_if_error: false
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # v0.69.0 teve assets removidos no GitHub; usar versão com release disponível.
          version: 'v0.69.2'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Ignora artefatos de build .NET (deps.json em bin/obj); dependências são controladas por csproj/Directory.Build.props.
          skip-dirs: '**/bin,**/obj'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  flutter-app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/arah.app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.27+ para CardThemeData em ThemeData.cardTheme (Material theme normalization).
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test with coverage
        run: flutter test --coverage
      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: frontend/arah.app/coverage/lcov.info
          fail_ci_if_error: false
          flags: flutter
          name: flutter-app-coverage

  flutter-playwright:
    name: Flutter Playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/arah.app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/arah.app/e2e/package-lock.json
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build Flutter web
        run: flutter build web --web-renderer html
      - name: Install Playwright dependencies
        working-directory: frontend/arah.app/e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend/arah.app/e2e
        run: npx playwright install --with-deps chromium
      - name: Run login smoke
        working-directory: frontend/arah.app/e2e
        run: npm run test:smoke
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-login-smoke-${{ github.run_id }}
          path: |
            frontend/arah.app/e2e/playwright-report
            frontend/arah.app/e2e/test-results
          if-no-files-found: warn

  flutter-playwright-pixel-parity:
    name: Flutter Playwright pixel parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/arah.app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/arah.app/e2e/package-lock.json
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build Flutter web
        run: flutter build web
      - name: Install Playwright dependencies
        working-directory: frontend/arah.app/e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend/arah.app/e2e
        run: npx playwright install --with-deps chromium
      - name: Run login pixel parity
        working-directory: frontend/arah.app/e2e
        run: npm run test:pixel-parity
      - name: Upload Playwright pixel parity artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-login-pixel-parity-${{ github.run_id }}
          path: |
            frontend/arah.app/e2e/playwright-report
            frontend/arah.app/e2e/test-results
          if-no-files-found: warn
