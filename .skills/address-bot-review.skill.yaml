id: address-bot-review
description: |
  Audita apontamentos que bloqueiam merge: threads inline NÃO resolvidas de bots de review
  (CodeRabbit, Bugbot, Codex, …) + falhas CI. Ignora sinalização Arah (domain-consult,
  agent-activity, gates, steward, pr-graph) e issue comments de github-actions.
inputs:
  pr_number: integer
  base_ref: string
run:
  script: scripts/agents/address-bot-review.ps1
review_bot_patterns:
  - coderabbit
  - bugbot
  - chatgpt-codex
  - codex
  - cursor
  - codeql
  - trivy
  - dependabot
ignore_as_signal:
  - arah-domain-consult
  - arah-agent-activity
  - arah-orchestrator
  - arah-qa-gate
  - arah-security-gate
  - arah-pr-steward
  - arah-pr-graph
  - github-actions issue comments
resolution:
  - fix_in_same_pr
  - reply_with_rationale_and_link
  - dismiss_if_false_positive_with_comment
on_unresolved: block_ready_for_merge
references:
  - .agents/templates/bot-review-checklist.md
  - docs/ops/AGENT_PR_FLOW_INTEGRITY.md
  - docs/21_CODE_REVIEW.md
